# Corre la prueba de humo en cada push y en cada pull request. En main la
# corre pages.yml, antes de publicar. humo.mjs no necesita dependencias.

name: Pruebas

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de humo (incluye las aserciones de pruebas.html)
        env:
          CHROME: /usr/bin/google-chrome   # viene instalado en ubuntu-latest
        run: node herramientas/humo.mjs
