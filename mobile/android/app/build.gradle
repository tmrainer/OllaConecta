apply plugin: 'com.android.application'

android {
    namespace = "io.github.tmrainer.asistencia"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.tmrainer.asistencia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.7.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma de la versión final: la clave vive FUERA del repositorio. Si existe
    // mobile/firma.properties, el APK final sale firmado;
    // si no, solo se puede armar el de prueba (assembleDebug).
    def firma = new Properties()
    def archivoFirma = rootProject.file('../firma.properties')
    if (archivoFirma.exists()) { archivoFirma.withInputStream { firma.load(it) } }
    signingConfigs {
        if (archivoFirma.exists()) {
            release {
                storeFile file(firma['archivo'])
                storePassword firma['clave']
                keyAlias firma['alias']
                keyPassword firma['claveAlias']
            }
        }
    }
    buildTypes {
        release {
            // Sin firma.properties se firma con la clave de depuración: el APK
            // instala igual (y actualiza a uno de prueba anterior), pero ya
            // sale optimizado. La clave final sigue siendo la de firma.properties.
            signingConfig archivoFirma.exists() ? signingConfigs.release : signingConfigs.debug
            // R8: quita el código y los recursos que no se usan y compacta el
            // resto. El APK de prueba traía 11 MB de .dex en 11 archivos; en
            // un teléfono de gama baja eso es más tiempo de instalación y de
            // arranque (ART verifica y carga todo) y más memoria.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // La app está solo en español: fuera las traducciones de appcompat, de
    // los servicios de Google y de Firebase (decenas de idiomas en resources.arsc).
    androidResources {
        localeFilters += ['es']
    }
    packaging {
        resources {
            // Metadatos de Kotlin y de corrutinas que solo sirven para compilar.
            excludes += ['kotlin/**', 'DebugProbesKt.bin', 'META-INF/*.version', 'META-INF/*.kotlin_module']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Leer la zona de texto (MRZ) del DNI: ML Kit a través de los servicios
    // de Google Play. El modelo lo instala el propio teléfono una vez (ver
    // AndroidManifest.xml); el incluido en el APK lo hacía pesar 45 MB más.
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
